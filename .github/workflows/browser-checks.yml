name: Browser checks (independent)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Browser failures never gate Pages. New work replaces outdated checks only.
concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - name: Cache Chromium downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        timeout-minutes: 4
      - name: Test mouse, touch and keyboard interaction
        run: npm run test:ui -- --reporter=list --workers=2
        timeout-minutes: 10
      - name: Keep browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-checks
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
